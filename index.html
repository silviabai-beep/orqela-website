<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07142b">
  <meta name="description" content="ORQELA 投资人客户介绍 v3.6 - 可排序的网页幻灯片">
  <title>ORQELA v3.6｜演示文稿</title>
  <link rel="stylesheet" href="styles.css?v=6">
  <link rel="stylesheet" href="editor-overrides.css?v=6">
</head>
<body>
  <aside class="rail" aria-label="幻灯片导航">
    <div class="rail-brand"><span class="qmark">Q</span><div><b>ORQELA</b><small>v3.6 · SLIDE BUILDER</small></div></div>
    <div class="rail-heading"><span>页面</span><b id="deck-count">15</b></div>
    <div class="slide-list" id="slide-list" aria-label="可拖拽页面列表"></div>
    <div class="rail-actions viewer-actions">
      <a class="primary-editor" href="admin.html">✎ 编辑图片和文字</a>
    </div>
      <p class="rail-help">只有一个网页版本。进入在线编辑器后可直接修改中英文文字，并拖动、缩放图片或图形。</p>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div class="doc-title"><b>ORQELA 投资人客户介绍</b><span>网页可编辑版 · v3.6</span></div>
      <div class="toolbar">
        <button id="prev-slide" aria-label="上一页">←</button>
        <label>页码 <input id="page-number" type="number" min="1" value="1" aria-label="当前页码"></label>
        <span id="page-total">/ 15</span>
        <button id="next-slide" aria-label="下一页">→</button>
        <div class="public-language-tabs" aria-label="Language">
          <button id="public-language-zh" class="active">中文</button>
          <button id="public-language-en">EN</button>
        </div>
        <button id="save-deck" hidden>保存草稿</button>
        <button id="reset-deck" hidden>恢复 15 页</button>
        <a class="admin-link" href="admin.html">✎ 编辑图片和文字</a>
        <button id="present-deck" class="present">演示</button>
      </div>
    </header>

    <section class="canvas-shell" aria-live="polite">
      <button class="stage-nav prev" id="stage-prev" aria-label="上一页">‹</button>
      <div class="stage" id="stage">
        <img id="slide-image" alt="当前 ORQELA 幻灯片">
        <article id="english-slide" class="english-slide" hidden>
          <span id="native-slide-kicker" class="english-slide-kicker">ORQELA · 中文版本</span>
          <h1 id="english-slide-title"></h1>
          <p id="english-slide-body"></p>
          <footer><span>ORQELA</span><span id="english-slide-number"></span></footer>
        </article>
        <div id="slide-layers" class="slide-layers" aria-hidden="true"></div>
        <div id="blank-slide" class="blank-slide" hidden>
          <span>ORQELA</span>
          <h1 contenteditable="true" spellcheck="false">双击输入新页面标题</h1>
          <p contenteditable="true" spellcheck="false">可在此输入备注，或使用“替换图片”上传新的页面图。</p>
        </div>
      </div>
      <button class="stage-nav next" id="stage-next" aria-label="下一页">›</button>
    </section>
    <footer><span id="status">正在加载网页版本</span><span>方向键翻页 · Esc 退出演示</span></footer>
  </main>
  <input id="image-picker" type="file" accept="image/*" hidden>
  <script type="module" src="script.js?v=11"></script>
</body>
</html>
