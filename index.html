<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07142b">
  <meta name="description" content="ORQELA 投资人客户介绍 v3.6 - 可排序的网页幻灯片">
  <title>ORQELA v3.6｜演示文稿</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <aside class="rail" aria-label="幻灯片导航">
    <div class="rail-brand"><span class="qmark">Q</span><div><b>ORQELA</b><small>v3.6 · SLIDE BUILDER</small></div></div>
    <div class="rail-heading"><span>页面</span><b id="deck-count">15</b></div>
    <div class="slide-list" id="slide-list" aria-label="可拖拽页面列表"></div>
    <div class="rail-actions">
      <button id="add-slide" class="primary">＋ 新增页</button>
      <button id="duplicate-slide">复制</button>
      <button id="delete-slide">删除</button>
      <button id="replace-image">替换图片</button>
    </div>
    <p class="rail-help">拖动缩略图调整顺序。所有更改仅保存在当前浏览器。</p>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div class="doc-title"><b>ORQELA 投资人客户介绍</b><span>Canva 可编辑版 · v3.6</span></div>
      <div class="toolbar">
        <button id="prev-slide" aria-label="上一页">←</button>
        <label>页码 <input id="page-number" type="number" min="1" value="1" aria-label="当前页码"></label>
        <span id="page-total">/ 15</span>
        <button id="next-slide" aria-label="下一页">→</button>
        <button id="save-deck">保存</button>
        <button id="reset-deck">恢复 15 页</button>
        <a class="canva" href="https://www.canva.com/design/DAHR8BHX_j4/PBM6m6QJqnxjpvj5RPpnGg/edit" target="_blank" rel="noopener">在 Canva 编辑 ↗</a>
        <button id="present-deck" class="present">演示</button>
      </div>
    </header>

    <section class="canvas-shell" aria-live="polite">
      <button class="stage-nav prev" id="stage-prev" aria-label="上一页">‹</button>
      <div class="stage" id="stage">
        <img id="slide-image" alt="当前 ORQELA 幻灯片">
        <div id="blank-slide" class="blank-slide" hidden>
          <span>ORQELA</span>
          <h1 contenteditable="true" spellcheck="false">双击输入新页面标题</h1>
          <p contenteditable="true" spellcheck="false">可在此输入备注，或使用“替换图片”上传新的页面图。</p>
        </div>
      </div>
      <button class="stage-nav next" id="stage-next" aria-label="下一页">›</button>
    </section>
    <footer><span id="status">已加载 Canva v3.6</span><span>方向键翻页 · Esc 退出演示</span></footer>
  </main>
  <input id="image-picker" type="file" accept="image/*" hidden>
  <script src="script.js?v=4"></script>
</body>
</html>
